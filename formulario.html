<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Formulario de Prueba</title>
</head>
<body>
  <h2>Formulario de prueba </h2>

  <form>
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre"><br><br>

    <p>¿Pudiste subir tu parte al repositorio?</p>
    <input type="radio" id="si" name="repositorio" value="si">
    <label for="si">Sí</label><br>
    <input type="radio" id="no" name="repositorio" value="no">
    <label for="no">No</label><br>

    <p>¿Aceptas que el equipo 4 es el mejor?</p>
    <button onclick="alert('¡Respuesta correcta! 🏆 Has demostrado tener buen gusto.')">
    Aceptar
    </button>

  </form>
</body>
</html>
